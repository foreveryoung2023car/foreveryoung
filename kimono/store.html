<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=0">
<title>門市後台 — 旅乘 x 和服</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Noto Serif TC',serif;background:#FDFCF8;color:#1A365D;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:white;border-radius:14px;box-shadow:0 8px 32px rgba(26,54,93,.12);max-width:480px;padding:48px 32px;text-align:center}
  .logo{width:72px;height:72px;background:#1A365D;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:28px;margin-bottom:24px}
  .title{font-size:22px;font-weight:700;letter-spacing:.1em;margin-bottom:12px}
  .subtitle{font-size:14px;color:#64748B;line-height:1.7;margin-bottom:28px;font-family:'Noto Sans TC',sans-serif}
  .btn{display:inline-block;background:#1A365D;color:white;padding:14px 28px;border-radius:10px;text-decoration:none;font-weight:700;letter-spacing:.1em;font-family:'Noto Sans TC',sans-serif;transition:.2s}
  .btn:hover{background:#0f2240;transform:translateY(-2px);box-shadow:0 6px 18px rgba(26,54,93,.25)}
  .note{margin-top:24px;font-size:12px;color:#94A3B8;font-family:'Noto Sans TC',sans-serif;line-height:1.7}
  .countdown{font-size:13px;color:#1A365D;font-family:'Noto Sans TC',sans-serif;margin-top:16px}
</style>
<meta http-equiv="refresh" content="5;url=./admin.html">
</head>
<body>

<div class="card">
  <div class="logo">旅</div>
  <div class="title">門市後台已搬家</div>
  <div class="subtitle">
    從 v2.5 開始，門市後台已併入統一登入頁。<br>
    請改用同一組門市帳號到「客服／門市後台」登入。
  </div>
  <a href="./admin.html" class="btn">前往新登入頁 →</a>
  <div class="countdown" id="countdown">5 秒後自動跳轉…</div>
  <div class="note">
    👉 登入帳號 = 您的門市代號（例：kyoto1 / osaka1）<br>
    👉 密碼 = 與原本門市登入相同<br>
    👉 登入後可看到完整訂單資訊與「＋ 現場新增」功能
  </div>
</div>

<script>
  let n = 5;
  const cd = document.getElementById('countdown');
  const t = setInterval(() => {
    n--;
    if (n > 0) cd.textContent = n + ' 秒後自動跳轉…';
    else { clearInterval(t); location.href = './admin.html'; }
  }, 1000);
</script>

</body>
</html>
