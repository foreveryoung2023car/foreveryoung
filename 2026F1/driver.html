<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>旅乘 F1 鈴鹿接駁 - 司機</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');

:root {
  --red:    #e8002d;
  --bg:     #f0f2f5;
  --card:   #ffffff;
  --border: #e2e8f0;
  --text:   #0f172a;
  --muted:  #64748b;
  --green:  #16a34a;
  --orange: #ea580c;
  --purple: #7c3aed;
  --r: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding-bottom: 60px;
}

/* Header */
.hdr {
  background: var(--red); padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 99;
  box-shadow: 0 2px 10px rgba(232,0,45,0.3);
}
.hdr-logo { font-size: 20px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
.hdr-badge {
  background: rgba(255,255,255,0.22); color: #fff;
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  padding: 3px 7px; border-radius: 4px; margin-left: 8px;
}
.hdr-info { font-size: 13px; color: rgba(255,255,255,0.92); font-weight: 600; }

/* 車號車牌列 */
.car-bar {
  background: #1e293b; padding: 10px 18px;
  display: none; align-items: center; gap: 12px;
}
.car-bar.show { display: flex; }
.car-vid   { font-size: 18px; font-weight: 900; color: #fff; }
.car-plate {
  background: var(--red); color: #fff;
  font-size: 14px; font-weight: 800;
  padding: 4px 14px; border-radius: 6px; letter-spacing: 1px;
}
.car-type  { font-size: 13px; color: #94a3b8; }

/* 去程/回程切換 */
.trip-bar { display: flex; background: #fff; border-bottom: 1px solid var(--border); }
.trip-btn {
  flex: 1; padding: 15px 8px; text-align: center;
  font-size: 15px; font-weight: 700; color: var(--muted);
  border: none; border-bottom: 3px solid transparent;
  background: none; cursor: pointer; transition: all 0.2s;
}
.trip-btn.out.active { color: var(--red);    border-bottom-color: var(--red); }
.trip-btn.ret.active { color: var(--purple); border-bottom-color: var(--purple); }

/* 容器 */
.wrap { padding: 14px; max-width: 560px; margin: 0 auto; }

/* 車輛資訊卡 */
.car-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); padding: 18px 20px; margin-bottom: 12px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
.car-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.car-item { font-size: 15px; color: var(--muted); font-weight: 500; }
.car-item b { display: block; color: var(--text); font-weight: 800; font-size: 20px; margin-top: 3px; }

/* 出發/送達按鈕 */
.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.act-btn {
  padding: 14px 10px; border-radius: var(--r); text-align: center;
  font-size: 14px; font-weight: 800; cursor: pointer;
  border: 2px solid var(--border); background: var(--card); color: var(--muted);
  transition: background 0.15s, border-color 0.15s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05); user-select: none;
}
.act-btn .icon { font-size: 22px; display: block; margin-bottom: 4px; }
.act-btn.dep-on { border-color: var(--orange); background: #fff7ed; color: var(--orange); }
.act-btn.arr-on { border-color: var(--green);  background: #f0fdf4; color: var(--green); }
.act-btn .time  { font-size: 12px; font-weight: 600; margin-top: 3px; opacity: 0.85; }

/* 進度卡 */
.prog-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); padding: 14px 18px; margin-bottom: 12px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
.prog-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.prog-label { font-size: 14px; font-weight: 600; color: var(--muted); }
.prog-num { font-size: 24px; font-weight: 900; }
.prog-num.done { color: var(--green); }
.prog-bar { height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; }
.prog-fill {
  height: 100%; border-radius: 5px;
  background: linear-gradient(90deg, var(--green), #4ade80);
  transition: width 0.5s;
}

/* 乘客清單 */
.pax-list { display: flex; flex-direction: column; gap: 10px; }
.pax {
  background: var(--card); border: 2px solid var(--border);
  border-radius: var(--r); padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05); transition: all 0.15s;
}
.pax.ok { border-color: var(--green); background: #f0fdf4; }
.pax.no { border-color: #fca5a5;      background: #fff5f5; opacity: 0.8; }
.pax-ico {
  width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; background: #f1f5f9;
}
.pax-ico.ok { background: #dcfce7; }
.pax-ico.no { background: #fee2e2; }
.pax-body { flex: 1; min-width: 0; }
.pax-name { font-size: 19px; font-weight: 800; }
.pax-time { font-size: 12px; color: var(--muted); margin-top: 2px; }
.pax-r { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex-shrink: 0; }
.pax-n {
  font-size: 16px; font-weight: 900;
  background: #f1f5f9; padding: 4px 13px; border-radius: 20px;
  border: 1px solid var(--border);
}
.pax-btns { display: flex; gap: 6px; }
.pb {
  padding: 8px 13px; border-radius: 8px; font-size: 13px; font-weight: 700;
  cursor: pointer; border: none; transition: all 0.15s; white-space: nowrap;
  font-family: 'Noto Sans TC', sans-serif;
}
.pb-ok  { background: var(--green); color: #fff; }
.pb-ok:active  { background: #15803d; }
.pb-no  { background: #fff; color: var(--muted); border: 2px solid var(--border); }
.pb-no:active  { border-color: var(--red); color: var(--red); }
.pb-rst { background: #fff; color: var(--muted); border: 1px solid var(--border); font-size: 12px; }

/* 全部確認 */
.btn-all {
  width: 100%; padding: 18px; margin-top: 16px;
  background: linear-gradient(135deg, var(--green), #22c55e);
  color: #fff; font-size: 17px; font-weight: 900;
  border: none; border-radius: var(--r); cursor: pointer;
  box-shadow: 0 4px 14px rgba(22,163,74,0.35); transition: all 0.2s;
  font-family: 'Noto Sans TC', sans-serif;
}
.btn-all:hover   { transform: translateY(-2px); }
.btn-all:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

/* 空白/錯誤 */
.empty { text-align: center; padding: 70px 20px; color: var(--muted); }
.empty .ico { font-size: 52px; margin-bottom: 14px; }
.empty .ttl { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
.empty .sub { font-size: 14px; line-height: 1.6; }

/* Loading */
.loading { text-align: center; padding: 70px 20px; }
.spin {
  width: 38px; height: 38px; margin: 0 auto 16px;
  border: 3px solid #e2e8f0; border-top-color: var(--red);
  border-radius: 50%; animation: rot 0.8s linear infinite;
}
@keyframes rot { to { transform: rotate(360deg); } }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #0f172a; color: #fff; padding: 13px 26px;
  border-radius: 24px; font-size: 15px; font-weight: 600;
  z-index: 999; opacity: 0; transition: opacity 0.25s;
  pointer-events: none; white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex;align-items:center">
    <span class="hdr-logo">旅乘</span>
    <span class="hdr-badge">F1 SUZUKA 2026</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="hdr-info" id="hdrInfo">載入中...</div>
    <button onclick="load()" style="background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer">🔄</button>
  </div>
</div>

<div class="car-bar" id="carBar">
  <div class="car-vid"  id="carVid"></div>
  <div class="car-plate" id="carPlate"></div>
  <div class="car-type"  id="carType"></div>
</div>

<div class="trip-bar" id="tripBar" style="display:none">
  <button class="trip-btn out active" id="btnOut" onclick="setTrip('outbound')">🚌 去程上車</button>
  <button class="trip-btn ret"        id="btnRet" onclick="setTrip('return')">🔁 回程上車</button>
</div>

<div id="main"><div class="loading"><div class="spin"></div></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const qs   = new URLSearchParams(location.search);
const CAR  = qs.get("car")  || "";
const DATE = qs.get("date") || bestDate();
const DATE_LABEL = {
  "0326":"03/26（四）","0327":"03/27（五）",
  "0328":"03/28（六）","0329":"03/29（日）"
};
const SUZUKA = "鈴鹿賽車場";

function bestDate() {
  const n = new Date();
  const s = String(n.getMonth()+1).padStart(2,"0") + String(n.getDate()).padStart(2,"0");
  return ["0326","0327","0328","0329"].find(d => d >= s) || "0329";
}

function jstHour() {
  try {
    const s = new Date().toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",hour12:false});
    return parseInt(s.replace(/[^\d]/g,""));
  } catch(e) {
    const d = new Date();
    return new Date(d.getTime()+(9*60+d.getTimezoneOffset())*60000).getHours();
  }
}

function jstTime() {
  try {
    const s = new Date().toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",hour12:false});
    return s.replace(/[^\d:]/g,"").substring(0,5);
  } catch(e) {
    const d = new Date();
    const jst = new Date(d.getTime()+(9*60+d.getTimezoneOffset())*60000);
    return String(jst.getHours()).padStart(2,"0")+":"+String(jst.getMinutes()).padStart(2,"0");
  }
}
function nowStr() { return jstTime(); }

let TRIP = qs.get("trip") || (jstHour() < 13 ? "outbound" : "return");
let DATA = null;

// ── 初始化 ──
window.addEventListener("load", () => {
  if (!CAR) { showNoCar(); return; }
  document.getElementById("tripBar").style.display = "flex";
  updateTripUI();
  load();
});

function setTrip(trip) {
  TRIP = trip;
  updateTripUI();
  if (DATA) render();
}
function updateTripUI() {
  document.getElementById("btnOut").className = `trip-btn out ${TRIP==="outbound"?"active":""}`;
  document.getElementById("btnRet").className = `trip-btn ret ${TRIP==="return"?"active":""}`;
}

// ── 載入 ──
async function load() {
  try {
    const r = await fetch(`${API}?action=getPassengers&car=${encodeURIComponent(CAR)}&date=${DATE}`);
    DATA = await r.json();
    render();
  } catch(e) {
    document.getElementById("main").innerHTML =
      `<div class="empty"><div class="ico">⚠️</div><div class="ttl">載入失敗</div><div class="sub">請重新整理頁面</div></div>`;
  }
}

// ── 渲染 ──
function render() {
  if (!DATA || !DATA.carInfo) { showNoCar(); return; }
  const { carInfo, passengers, summary } = DATA;
  const isOut = TRIP === "outbound";
  const conf  = isOut ? summary.outConfirmed : summary.retConfirmed;
  const total = summary.total;
  const pct   = total > 0 ? Math.round(conf/total*100) : 0;
  const done  = conf === total && total > 0;
  const pt    = simplePt(carInfo.depPt);

  // Header
  document.getElementById("hdrInfo").textContent = DATE_LABEL[DATE]||DATE;

  // 車號車牌列
  const carBar = document.getElementById("carBar");
  carBar.className = "car-bar show";
  document.getElementById("carVid").textContent   = carInfo.vid   || "";
  document.getElementById("carPlate").textContent = carInfo.plate || CAR;
  document.getElementById("carType").textContent  = carInfo.vtype || "";

  // 出發/送達時間（優先從API取，fallback localStorage）
  const depKey = `${isOut?"out_depart":"ret_depart"}_${CAR}_${DATE}`;
  const arrKey = `${isOut?"out_arrive":"ret_arrive"}_${CAR}_${DATE}`;
  const depTime = (isOut ? carInfo.outDepart : carInfo.retDepart) || localStorage.getItem(depKey) || "";
  const arrTime = (isOut ? carInfo.outArrive : carInfo.retArrive) || localStorage.getItem(arrKey) || "";

  let h = `<div class="wrap">`;

  // ── 車輛資訊（去程/回程顯示不同）──
  h += `
  <div class="car-card">
    <div class="car-grid">
      <div class="car-item">上車地點<b>${isOut ? pt : SUZUKA}</b></div>
      <div class="car-item">下車地點<b>${isOut ? SUZUKA : pt}</b></div>
      <div class="car-item">出發時間<b>${isOut ? carInfo.depTime : carInfo.retTime}</b></div>
      <div class="car-item">乘客總數<b>${total} 人</b></div>
    </div>
  </div>`;

  // ── 已出發 / 已送達 ──
  h += `
  <div class="action-row">
    <div class="act-btn ${depTime?"dep-on":""}" onclick="toggleDep()">
      <span class="icon">🚀</span>
      ${depTime ? "已出發" : "標記已出發"}
      ${depTime ? `<div class="time">${depTime}</div>` : ""}
    </div>
    <div class="act-btn ${arrTime?"arr-on":""}" onclick="toggleArr()">
      <span class="icon">🏁</span>
      ${arrTime ? "已送達" : "標記已送達"}
      ${arrTime ? `<div class="time">${arrTime}</div>` : ""}
    </div>
  </div>`;

  // ── 進度 ──
  h += `
  <div class="prog-card">
    <div class="prog-top">
      <div class="prog-label">${isOut?"🚌 去程上車確認":"🔁 回程上車確認"}</div>
      <div class="prog-num ${done?"done":""}">${conf} / ${total} 人</div>
    </div>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
  </div>`;

  // ── 乘客清單 ──
  h += `<div class="pax-list">`;
  passengers.forEach(p => {
    const st   = isOut ? p.outStatus : p.retStatus;
    const time = isOut ? p.outTime   : p.retTime;
    const isOk = st === "✅";
    const isNo = st === "❌";
    h += `
    <div class="pax ${isOk?"ok":isNo?"no":""}">
      <div class="pax-ico ${isOk?"ok":isNo?"no":""}">${isOk?"✅":isNo?"❌":"👤"}</div>
      <div class="pax-body">
        <div class="pax-name">${p.name}</div>
        ${time?`<div class="pax-time">確認 ${time}</div>`:""}
      </div>
      <div class="pax-r">
        <div class="pax-n">×${p.pax}人</div>
        <div class="pax-btns">
          ${!isOk?`<button class="pb pb-ok" onclick="doOk('${p.orderNo}')">✅ 上車</button>`:""}
          ${!isNo?`<button class="pb pb-no" onclick="doNo('${p.orderNo}')">❌ 未到</button>`:""}
          ${(isOk||isNo)?`<button class="pb pb-rst" onclick="doRst('${p.orderNo}')">重置</button>`:""}
        </div>
      </div>
    </div>`;
  });
  h += `</div>`;

  // ── 全部確認 ──
  h += `
  <button class="btn-all" onclick="allOk()" ${done?"disabled":""}>
    ${done ? "✅ 全部已確認完成！" : "一鍵全部確認上車"}
  </button>
  </div>`;

  document.getElementById("main").innerHTML = h;
}

// ── 出發/送達（樂觀更新）──
async function toggleDep() {
  const isOut = TRIP === "outbound";
  const action      = isOut ? "out_depart"     : "ret_depart";
  const clearAction = isOut ? "out_depart_clr" : "ret_depart_clr";
  const key = `${action}_${CAR}_${DATE}`;
  const isClear = !!localStorage.getItem(key);
  if (isClear) {
    if (!confirm("確定取消出發記錄？")) return;
    localStorage.removeItem(key);
  } else {
    localStorage.setItem(key, nowStr());
  }
  render();
  post(isClear ? clearAction : action, null, true);
}

async function toggleArr() {
  const isOut = TRIP === "outbound";
  const action      = isOut ? "out_arrive"     : "ret_arrive";
  const clearAction = isOut ? "out_arrive_clr" : "ret_arrive_clr";
  const key = `${action}_${CAR}_${DATE}`;
  const isClear = !!localStorage.getItem(key);
  if (isClear) {
    if (!confirm("確定取消送達記錄？")) return;
    localStorage.removeItem(key);
  } else {
    localStorage.setItem(key, nowStr());
  }
  render();
  post(isClear ? clearAction : action, null, true);
}

// ── 上車確認（樂觀更新）──
async function doOk(no) { optimisticUpdate(no,"✅"); await post("confirm",no); }
async function doNo(no) { optimisticUpdate(no,"❌"); await post("absent",no); }
async function doRst(no){ optimisticUpdate(no,"");  await post("reset",no);  }

function optimisticUpdate(orderNo, status) {
  if (!DATA) return;
  const p = DATA.passengers.find(p => p.orderNo === orderNo);
  if (!p) return;
  if (TRIP==="outbound") p.outStatus = status;
  else p.retStatus = status;
  const outConf = DATA.passengers.filter(p=>p.outStatus==="✅").reduce((s,p)=>s+p.pax,0);
  const retConf = DATA.passengers.filter(p=>p.retStatus==="✅").reduce((s,p)=>s+p.pax,0);
  DATA.summary.outConfirmed = outConf;
  DATA.summary.retConfirmed = retConf;
  DATA.summary.outPending = DATA.summary.total - outConf;
  DATA.summary.retPending = DATA.summary.total - retConf;
  render();
}

async function allOk() {
  if (!DATA) return;
  const pend = DATA.passengers.filter(p =>
    (TRIP==="outbound" ? p.outStatus : p.retStatus) !== "✅"
  );
  pend.forEach(p => {
    if (TRIP==="outbound") p.outStatus = "✅"; else p.retStatus = "✅";
  });
  const total = DATA.summary.total;
  if (TRIP==="outbound") { DATA.summary.outConfirmed=total; DATA.summary.outPending=0; }
  else { DATA.summary.retConfirmed=total; DATA.summary.retPending=0; }
  render();
  for (const p of pend) await post("confirm", p.orderNo);
}

async function post(action, orderNo, isCarAction) {
  try {
    const body = isCarAction
      ? { action, car:CAR, date:DATE, trip:TRIP, time:jstTime() }
      : { action, orderNo, date:DATE, trip:TRIP };
    const r = await fetch(API, { method:"POST", body:JSON.stringify(body) });
    const d = await r.json();
    if (d.success) {
      if (isCarAction) {
        toast(action.includes("depart")
          ? (action.endsWith("_clr")?"已取消出發":"🚀 已記錄出發時間")
          : (action.endsWith("_clr")?"已取消送達":"🏁 已記錄送達時間"));
      }
      // 背景靜默更新時間
      fetch(`${API}?action=getPassengers&car=${encodeURIComponent(CAR)}&date=${DATE}`)
        .then(r=>r.json()).then(fresh=>{
          if (fresh.passengers && DATA) {
            fresh.passengers.forEach(fp=>{
              const loc = DATA.passengers.find(p=>p.orderNo===fp.orderNo);
              if (loc) { loc.outTime=fp.outTime; loc.retTime=fp.retTime; }
            });
            if (fresh.carInfo && DATA.carInfo) {
              DATA.carInfo.outDepart = fresh.carInfo.outDepart;
              DATA.carInfo.outArrive = fresh.carInfo.outArrive;
              DATA.carInfo.retDepart = fresh.carInfo.retDepart;
              DATA.carInfo.retArrive = fresh.carInfo.retArrive;
            }
          }
        }).catch(()=>{});
    } else if (!isCarAction) {
      toast("⚠️ 操作失敗，請重試");
      const fr = await fetch(`${API}?action=getPassengers&car=${encodeURIComponent(CAR)}&date=${DATE}`);
      DATA = await fr.json(); render();
    }
  } catch(e) { toast("操作失敗，請重試"); }
}

// ── 輔助 ──
function showNoCar() {
  document.getElementById("tripBar").style.display = "none";
  document.getElementById("hdrInfo").textContent = "";
  document.getElementById("main").innerHTML = `
    <div class="empty">
      <div class="ico">🚌</div>
      <div class="ttl">找不到車輛資料</div>
      <div class="sub">請返回首頁重新查詢</div>
    </div>`;
}

function simplePt(pt) {
  if (!pt) return "";
  if (pt.includes("名駅")||pt.includes("名古屋")) return "名古屋站";
  if (pt.includes("榮")||pt.includes("栄"))       return "榮站";
  return pt;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}
</script>
</body>
</html>
