<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>旅乘 F1 鈴鹿接駁 - 司機</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
:root{--red:#e8002d;--bg:#f0f2f5;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--green:#16a34a;--purple:#7c3aed;--orange:#ea580c;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}
.hdr{background:var(--red);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99;box-shadow:0 2px 10px rgba(232,0,45,.3)}
.hdr-left{display:flex;align-items:center;gap:8px}
.hdr-logo{font-size:20px;font-weight:900;color:#fff}
.hdr-badge{background:rgba(255,255,255,.22);color:#fff;font-size:10px;font-weight:700;letter-spacing:1.5px;padding:3px 7px;border-radius:4px}
.hdr-info{font-size:13px;color:rgba(255,255,255,.92);font-weight:600}
.car-bar{background:#1e293b;padding:10px 18px;display:none;align-items:center;gap:10px;flex-wrap:wrap}
.car-bar.show{display:flex}
.car-vid{font-size:18px;font-weight:900;color:#fff}
.car-plate{background:var(--red);color:#fff;font-size:14px;font-weight:800;padding:4px 14px;border-radius:6px}
.car-type{font-size:13px;color:#94a3b8}
/* 去程/回程標籤 */
.trip-bar{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:52px;z-index:98}
.trip-btn{flex:1;padding:14px 8px;text-align:center;font-size:15px;font-weight:700;color:var(--muted);border:none;border-bottom:3px solid transparent;background:none;cursor:pointer;transition:all .2s;font-family:'Noto Sans TC',sans-serif;margin-bottom:-2px}
.trip-btn.out.active{color:var(--red);border-bottom-color:var(--red)}
.trip-btn.ret.active{color:var(--purple);border-bottom-color:var(--purple)}
.wrap{padding:14px;max-width:560px;margin:0 auto}
.car-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.car-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.car-item{font-size:14px;color:var(--muted);font-weight:500}
.car-item b{display:block;color:var(--text);font-weight:800;font-size:18px;margin-top:3px}
.seg-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800;margin-bottom:14px}
.seg-out{background:#fee2e2;color:var(--red)}
.seg-ret{background:#ede9fe;color:var(--purple)}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.act-btn{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:16px 12px;text-align:center;cursor:pointer;transition:all .2s}
.act-btn .icon{font-size:22px;display:block;margin-bottom:4px}
.act-btn .label{font-size:14px;font-weight:700;color:var(--muted)}
.act-btn .time{font-size:12px;font-weight:600;color:var(--green);margin-top:2px}
.act-btn.dep-on{background:#fff7ed;border-color:var(--orange)}
.act-btn.dep-on .label{color:var(--orange)}
.act-btn.arr-on{background:#f0fdf4;border-color:var(--green)}
.act-btn.arr-on .label{color:var(--green)}
.prog-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;margin-bottom:12px}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog-label{font-size:14px;font-weight:700}
.prog-num{font-size:20px;font-weight:900}
.prog-num.done{color:var(--green)}
.prog-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);transition:width .4s}
.pax-list{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.pax-hdr{padding:12px 18px;background:#f8fafc;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.pax-hdr-title{font-size:14px;font-weight:800}
.confirm-all-btn{font-size:12px;font-weight:700;color:var(--green);background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:5px 12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif}
.pax-row{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.pax-row:last-child{border-bottom:none}
.pax-info{}
.pax-name{font-size:16px;font-weight:800}
.pax-order{font-size:12px;color:var(--muted);margin-top:2px}
.pax-count{background:#f1f5f9;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.pax-btns{display:flex;gap:6px;flex-shrink:0}
.chk-btn{width:38px;height:38px;border-radius:10px;border:2px solid var(--border);font-size:18px;cursor:pointer;background:var(--card);transition:all .2s;display:flex;align-items:center;justify-content:center}
.chk-btn.on-ok{background:#f0fdf4;border-color:var(--green)}
.chk-btn.on-ng{background:#fff5f5;border-color:#ef4444}
.empty{text-align:center;padding:60px 20px}
.empty .ico{font-size:48px;margin-bottom:12px}
.empty .ttl{font-size:18px;font-weight:800;margin-bottom:6px}
.empty .sub{font-size:14px;color:var(--muted)}
.loading{text-align:center;padding:60px 20px}
.spin{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 24px;border-radius:30px;font-size:14px;font-weight:700;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.refresh-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px}
.no-pax{text-align:center;padding:30px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-logo">旅乘包車</div>
    <div class="hdr-badge">司機</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="hdr-info" id="hdrInfo"></div>
    <button class="refresh-btn" onclick="load()" title="重新整理">🔄</button>
  </div>
</div>

<div class="car-bar" id="carBar">
  <div class="car-vid"   id="carVid"></div>
  <div class="car-plate" id="carPlate"></div>
  <div class="car-type"  id="carType"></div>
</div>

<div class="trip-bar" id="tripBar" style="display:none">
  <button class="trip-btn out active" id="btnOut" onclick="setTrip('outbound')">🚌 去程</button>
  <button class="trip-btn ret"        id="btnRet" onclick="setTrip('return')">🔁 回程</button>
</div>

<div id="main"><div class="loading"><div class="spin"></div></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const qs   = new URLSearchParams(location.search);
const CAR  = qs.get("car")  || "";
const DATE = qs.get("date") || bestDate();
const DATE_LABEL = {"0326":"03/26（四）","0327":"03/27（五）","0328":"03/28（六）","0329":"03/29（日）"};
const SUZUKA = "鈴鹿賽車場 Motopia";

function bestDate() {
  const n = new Date();
  const jst = new Date(n.getTime()+(9*60+n.getTimezoneOffset())*60000);
  const s = String(jst.getMonth()+1).padStart(2,"0")+String(jst.getDate()).padStart(2,"0");
  return ["0326","0327","0328","0329"].find(d=>d>=s)||"0329";
}
function jstHour() {
  try {
    const s = new Date().toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",hour12:false});
    return parseInt(s.replace(/[^\d]/g,""));
  } catch(e) {
    const d = new Date();
    return new Date(d.getTime()+(9*60+d.getTimezoneOffset())*60000).getHours();
  }
}
function jstTime() {
  try {
    return new Date().toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",hour12:false}).replace(/[^\d:]/g,"").substring(0,5);
  } catch(e) {
    const jst = new Date(new Date().getTime()+(9*60+new Date().getTimezoneOffset())*60000);
    return String(jst.getHours()).padStart(2,"0")+":"+String(jst.getMinutes()).padStart(2,"0");
  }
}

function simplePt(pt) {
  if (!pt) return "";
  if (pt.includes("榮")||pt.includes("栄")) return "榮站";
  if (pt.includes("名駅")||pt.includes("名古屋")) return "名古屋站";
  return pt;
}

let TRIP = qs.get("trip") || (jstHour() < 12 ? "outbound" : "return");
let DATA = null;

window.addEventListener("load", () => {
  if (!CAR) { showNoCar(); return; }
  document.getElementById("tripBar").style.display = "flex";
  document.getElementById("hdrInfo").textContent = DATE_LABEL[DATE]||DATE;
  updateTripUI();
  load();
});

function setTrip(trip) {
  TRIP = trip;
  updateTripUI();
  if (DATA) render();
}
function updateTripUI() {
  document.getElementById("btnOut").className = "trip-btn out "+(TRIP==="outbound"?"active":"");
  document.getElementById("btnRet").className = "trip-btn ret "+(TRIP==="return"?"active":"");
}

async function load() {
  document.getElementById("main").innerHTML = '<div class="loading"><div class="spin"></div></div>';
  try {
    const r = await fetch(API+"?action=getPassengers&car="+encodeURIComponent(CAR)+"&date="+DATE);
    DATA = await r.json();
    render();
  } catch(e) {
    document.getElementById("main").innerHTML =
      '<div class="empty"><div class="ico">⚠️</div><div class="ttl">載入失敗</div><div class="sub">請重新整理頁面</div></div>';
  }
}

function render() {
  const isOut = TRIP === "outbound";

  // 根據去程/回程取對應資訊
  const info  = isOut ? DATA.depInfo  : DATA.retInfo;
  const paxList = isOut ? DATA.depPassengers : DATA.retPassengers;
  const summ  = DATA.summary;

  // 更新車號列
  const carBar = document.getElementById("carBar");
  carBar.className = "car-bar show";

  if (info) {
    document.getElementById("carVid").textContent   = info.vid   || "";
    document.getElementById("carPlate").textContent = info.plate || CAR;
    document.getElementById("carType").textContent  = info.vtype || "";
  } else {
    document.getElementById("carVid").textContent   = CAR;
    document.getElementById("carPlate").textContent = "";
    document.getElementById("carType").textContent  = "";
  }

  const conf  = isOut ? summ.outConfirmed : summ.retConfirmed;
  const total = isOut ? summ.depTotal     : summ.retTotal;
  const pct   = total > 0 ? Math.round(conf/total*100) : 0;
  const done  = conf === total && total > 0;

  const pt = info ? simplePt(info.depPt || info.retPt || "") : "";
  const depKey = (isOut?"out_depart":"ret_depart")+"_"+CAR+"_"+DATE;
  const arrKey = (isOut?"out_arrive":"ret_arrive")+"_"+CAR+"_"+DATE;
  const depT   = (isOut ? info?.outDepart : info?.retDepart) || localStorage.getItem(depKey) || "";
  const arrT   = (isOut ? info?.outArrive : info?.retArrive) || localStorage.getItem(arrKey) || "";

  let h = '<div class="wrap">';

  // 區段標籤
  h += '<div class="seg-badge '+(isOut?"seg-out":"seg-ret")+'">'+(isOut?"🚌 去程上車確認":"🔁 回程上車確認")+'</div>';

  // 車輛資訊卡
  if (info) {
    const fromPt = isOut ? pt   : SUZUKA;
    const toPt   = isOut ? SUZUKA : pt;
    const depTime = isOut ? (info.depTime||"07:00") : (info.retTime||"--:--");
    h += `
    <div class="car-card">
      <div class="car-grid">
        <div class="car-item">上車地點<b>${fromPt}</b></div>
        <div class="car-item">下車地點<b>${toPt}</b></div>
        <div class="car-item">出發時間<b>${depTime}</b></div>
        <div class="car-item">乘客<b>${total} 人</b></div>
      </div>
    </div>`;
  } else {
    h += '<div class="car-card"><div style="text-align:center;color:var(--muted);padding:10px">此行程無此台車的'+(isOut?"去程":"回程")+'資料</div></div>';
  }

  // 已出發/已送達
  h += `
  <div class="action-row">
    <div class="act-btn ${depT?"dep-on":""}" onclick="toggleDep()">
      <span class="icon">🚀</span>
      <span class="label">${depT?"已出發":"標記已出發"}</span>
      ${depT?'<div class="time">'+depT+'</div>':""}
    </div>
    <div class="act-btn ${arrT?"arr-on":""}" onclick="toggleArr()">
      <span class="icon">🏁</span>
      <span class="label">${arrT?"已送達":"標記已送達"}</span>
      ${arrT?'<div class="time">'+arrT+'</div>':""}
    </div>
  </div>`;

  // 進度條
  h += `
  <div class="prog-card">
    <div class="prog-top">
      <div class="prog-label">${isOut?"去程上車":"回程上車"}確認</div>
      <div class="prog-num ${done?"done":""}">${conf} / ${total} 人</div>
    </div>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
  </div>`;

  // 乘客名單
  if (!paxList || paxList.length === 0) {
    h += '<div class="car-card"><div class="no-pax">此行程無乘客資料</div></div>';
  } else {
    h += `
    <div class="pax-list">
      <div class="pax-hdr">
        <div class="pax-hdr-title">乘客名單（${paxList.length} 組）</div>
        <button class="confirm-all-btn" onclick="confirmAll()">一鍵全確認</button>
      </div>`;

    paxList.forEach(p => {
      const st     = isOut ? p.outStatus : p.retStatus;
      const isOk   = st === "✅";
      const isNg   = st === "❌";
      h += `
      <div class="pax-row" id="row_${p.orderNo}">
        <div class="pax-info">
          <div class="pax-name">${p.name}</div>
          <div class="pax-order">${p.orderNo}</div>
        </div>
        <div class="pax-count">×${p.pax}人</div>
        <div class="pax-btns">
          <button class="chk-btn ${isOk?"on-ok":""}" onclick="setPax('${p.orderNo}','confirm')" title="確認">✅</button>
          <button class="chk-btn ${isNg?"on-ng":""}" onclick="setPax('${p.orderNo}','absent')"  title="未到">❌</button>
        </div>
      </div>`;
    });
    h += '</div>';
  }

  // ── 一鍵複製催車通知（未確認 + 標記未到 都算）──
  const missingList = (paxList || []).filter(p => {
    const st = isOut ? p.outStatus : p.retStatus;
    return st !== "✅"; // 空白或❌都算未到
  });
  const missingPax = missingList.reduce((s,p) => s+p.pax, 0);

  if (missingList.length > 0 && info) {
    const vidLabel  = info.vid   || "";
    const plateLabel= info.plate || CAR;
    const timeLabel = isOut ? (info.depTime||"07:00") : (info.retTime||"--:--");
    const dateLabel = DATE_LABEL[DATE] || DATE;
    const names     = missingList.map(p => p.name+"×"+p.pax+"位").join("、");
    const msg =
`【${vidLabel} 車牌 ${plateLabel}】
發車：${dateLabel} ${timeLabel}
${names} 尚未抵達乘車位置，請盡速上車，逾時不候。感謝～`;

    h += `
    <div style="padding:0 0 16px">
      <button onclick="copyMsg()" id="copyMsgBtn"
        style="width:100%;padding:15px;border-radius:12px;border:none;
        background:#e8002d;color:#fff;font-size:15px;font-weight:900;
        cursor:pointer;font-family:'Noto Sans TC',sans-serif;
        box-shadow:0 4px 14px rgba(232,0,45,.3)">
        📢 複製催車通知（${missingPax}人未到）
      </button>
    </div>`;
    h += `<script>window._pendingMsg = ${JSON.stringify(msg)};<\/script>`;
  }

  h += '</div>';
  document.getElementById("main").innerHTML = h;
}

// ── 出發/送達 ──
async function toggleDep() {
  const isOut  = TRIP === "outbound";
  const action = isOut ? "out_depart" : "ret_depart";
  const clrAct = isOut ? "out_depart_clr" : "ret_depart_clr";
  const key    = (isOut?"out_depart":"ret_depart")+"_"+CAR+"_"+DATE;
  const cur    = (isOut ? DATA.depInfo?.outDepart : DATA.retInfo?.retDepart) || localStorage.getItem(key) || "";
  const seg    = isOut ? "去程" : "回程";

  if (cur) {
    await postAction({action: clrAct, car: CAR, date: DATE, segment: seg});
    localStorage.removeItem(key);
    if (isOut && DATA.depInfo) DATA.depInfo.outDepart = "";
    else if (DATA.retInfo)     DATA.retInfo.retDepart = "";
  } else {
    const t = jstTime();
    await postAction({action, car: CAR, date: DATE, segment: seg, time: t});
    localStorage.setItem(key, t);
    if (isOut && DATA.depInfo) DATA.depInfo.outDepart = t;
    else if (DATA.retInfo)     DATA.retInfo.retDepart = t;
  }
  render();
}

async function toggleArr() {
  const isOut  = TRIP === "outbound";
  const action = isOut ? "out_arrive" : "ret_arrive";
  const clrAct = isOut ? "out_arrive_clr" : "ret_arrive_clr";
  const key    = (isOut?"out_arrive":"ret_arrive")+"_"+CAR+"_"+DATE;
  const cur    = (isOut ? DATA.depInfo?.outArrive : DATA.retInfo?.retArrive) || localStorage.getItem(key) || "";
  const seg    = isOut ? "去程" : "回程";

  if (cur) {
    await postAction({action: clrAct, car: CAR, date: DATE, segment: seg});
    localStorage.removeItem(key);
    if (isOut && DATA.depInfo) DATA.depInfo.outArrive = "";
    else if (DATA.retInfo)     DATA.retInfo.retArrive = "";
  } else {
    const t = jstTime();
    await postAction({action, car: CAR, date: DATE, segment: seg, time: t});
    localStorage.setItem(key, t);
    if (isOut && DATA.depInfo) DATA.depInfo.outArrive = t;
    else if (DATA.retInfo)     DATA.retInfo.retArrive = t;
  }
  render();
}

// ── 乘客確認 ──
async function setPax(orderNo, action) {
  const isOut = TRIP === "outbound";
  const trip  = isOut ? "outbound" : "return";
  const pax   = (isOut ? DATA.depPassengers : DATA.retPassengers).find(p=>p.orderNo===orderNo);
  if (!pax) return;

  const cur    = isOut ? pax.outStatus : pax.retStatus;
  const newSt  = (action==="confirm" && cur!=="✅") ? "confirm"
               : (action==="absent"  && cur!=="❌") ? "absent"
               : "reset";

  // 樂觀更新
  const newVal = newSt==="confirm"?"✅" : newSt==="absent"?"❌" : "";
  if (isOut) pax.outStatus = newVal;
  else       pax.retStatus = newVal;
  if (newSt==="confirm") {
    if (isOut) DATA.summary.outConfirmed += pax.pax;
    else       DATA.summary.retConfirmed += pax.pax;
  }
  render();

  try {
    await postAction({action: newSt, orderNo, date: DATE, trip});
    showToast(newSt==="confirm"?"✅ 已確認" : newSt==="absent"?"❌ 標記未到" : "↩️ 已重置");
  } catch(e) {
    showToast("⚠️ 更新失敗");
  }
}

async function confirmAll() {
  const isOut  = TRIP === "outbound";
  const paxList = isOut ? DATA.depPassengers : DATA.retPassengers;
  for (const p of paxList) {
    if ((isOut ? p.outStatus : p.retStatus) === "✅") continue;
    if (isOut) { p.outStatus = "✅"; DATA.summary.outConfirmed += p.pax; }
    else       { p.retStatus = "✅"; DATA.summary.retConfirmed += p.pax; }
    postAction({action:"confirm", orderNo:p.orderNo, date:DATE, trip: isOut?"outbound":"return"});
  }
  render();
  showToast("✅ 全部確認完成");
}

// ── API ──
async function postAction(body) {
  const r = await fetch(API, {method:"POST", body:JSON.stringify(body)});
  return await r.json();
}

function showNoCar() {
  document.getElementById("main").innerHTML =
    '<div class="empty"><div class="ico">🚗</div><div class="ttl">請從查詢頁面進入</div><div class="sub">輸入車牌號碼後點選進入</div></div>';
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show";
  setTimeout(()=>{ t.className="toast"; }, 2000);
}

async function copyMsg() {
  const msg = window._pendingMsg || "";
  if (!msg) return;

  const btn = document.getElementById("copyMsgBtn");

  // 方法1：navigator.clipboard（需HTTPS）
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(msg);
      showToast("✅ 已複製！貼到 LINE 傳送給乘客");
      if (btn) { btn.textContent = "✅ 已複製！"; setTimeout(()=>{ btn.textContent = "📢 複製催車通知"; }, 2000); }
      return;
    } catch(e) {}
  }

  // 方法2：textarea + execCommand（舊版瀏覽器）
  try {
    const ta = document.createElement("textarea");
    ta.value = msg;
    ta.style.cssText = "position:fixed;top:0;left:0;width:2em;height:2em;padding:0;border:none;outline:none;box-shadow:none;background:transparent;opacity:0;";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, 99999);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if (ok) {
      showToast("✅ 已複製！貼到 LINE 傳送給乘客");
      if (btn) { btn.textContent = "✅ 已複製！"; setTimeout(()=>{ btn.textContent = "📢 複製催車通知"; }, 2000); }
      return;
    }
  } catch(e) {}

  // 方法3：都失敗就顯示訊息讓用戶手動複製
  prompt("請手動複製以下訊息：", msg);
}
</script>
</body>
</html>
