<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>旅乘 F1 鈴鹿接駁</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
:root {
  --red:#e8002d; --bg:#f0f2f5; --card:#fff; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b; --green:#16a34a; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.hdr{background:var(--red);padding:24px 20px;text-align:center;box-shadow:0 2px 10px rgba(232,0,45,.3)}
.hdr-logo{font-size:28px;font-weight:900;color:#fff}
.hdr-sub{font-size:12px;color:rgba(255,255,255,.8);margin-top:4px;letter-spacing:2px}

.wrap{padding:24px 16px;max-width:440px;margin:0 auto}

.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:24px 20px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.card-title{font-size:17px;font-weight:900;margin-bottom:6px}
.card-sub{font-size:13px;color:var(--muted);margin-bottom:20px}

.label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block}
.inp{
  width:100%;padding:14px 16px;border-radius:10px;
  border:2px solid var(--border);font-size:16px;
  font-family:'Noto Sans TC',sans-serif;color:var(--text);
  background:#f8fafc;transition:border-color .2s;margin-bottom:14px;
  -webkit-appearance:none
}
.inp:focus{outline:none;border-color:var(--red);background:#fff}
.inp::placeholder{color:#cbd5e1}

.btn{
  width:100%;padding:16px;border-radius:10px;
  font-size:16px;font-weight:900;cursor:pointer;border:none;
  background:var(--red);color:#fff;
  font-family:'Noto Sans TC',sans-serif;
  transition:all .2s;letter-spacing:.5px
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6}

.err{
  background:#fff5f5;border:1px solid #fca5a5;border-radius:10px;
  padding:12px 16px;font-size:14px;color:#dc2626;
  margin-top:14px;display:none
}
.err.show{display:block}

/* 結果區 */
.result{margin-top:20px;display:none}
.result.show{display:block}

/* 客人結果 */
.booking{
  background:#fff;border:2px solid var(--border);
  border-radius:var(--r);margin-bottom:12px;overflow:hidden
}
.booking-head{
  background:var(--red);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between
}
.booking-date{font-size:15px;font-weight:800;color:#fff}
.booking-status{
  font-size:12px;font-weight:700;padding:3px 10px;
  border-radius:12px;background:rgba(255,255,255,.2);color:#fff
}
.booking-body{padding:14px 16px}
.b-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b-item{font-size:13px;color:var(--muted)}
.b-item b{display:block;font-size:16px;font-weight:800;color:var(--text);margin-top:2px}

/* 司機結果 */
.car-btn{
  background:#f8fafc;border:2px solid var(--border);
  border-radius:10px;padding:16px;margin-bottom:10px;
  cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  transition:all .2s
}
.car-btn:hover{border-color:var(--text);background:#fff}
.car-btn:active{transform:scale(.98)}
.car-left{display:flex;align-items:center;gap:10px}
.car-plate{background:var(--red);color:#fff;font-size:14px;font-weight:800;padding:4px 12px;border-radius:6px}
.car-vid{font-size:17px;font-weight:900}
.car-info{font-size:13px;color:var(--muted);margin-top:2px}
.car-arrow{font-size:22px;color:var(--muted)}

.greeting{font-size:15px;font-weight:800;margin-bottom:14px}

/* Loading */
.dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin:0 3px;animation:dot 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">旅乘包車</div>
  <div class="hdr-sub">F1 SUZUKA 2026 接駁服務</div>
</div>

<div class="wrap">
  <div class="card">
    <div id="formArea">
    <div class="card-title">查詢乘車資訊</div>
    <div class="card-sub">請輸入姓名與電話號碼以查詢您的乘車安排</div>

    <label class="label">姓名</label>
    <input class="inp" id="inpName" type="text" placeholder="請輸入您的姓名"
      oninput="clearResult()" onkeydown="if(event.key==='Enter')doSearch()">

    <label class="label">電話號碼</label>
    <input class="inp" id="inpPhone" type="tel" inputmode="numeric" pattern="[0-9]*"
      placeholder="請輸入電話號碼（純數字）"
      oninput="this.value=this.value.replace(/[^0-9]/g,'');clearResult()"
      onkeydown="if(event.key==='Enter')doSearch()">

    <button class="btn" id="searchBtn" onclick="doSearch()">查詢</button>

    <div class="hint">查無資料？請確認姓名與電話號碼是否正確<br>電話請輸入純數字，不需要符號</div>

    <div class="err" id="errMsg"></div>
    </div>
    <div class="result" id="resultArea"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
function simplePt(pt) {
  if (!pt) return "";
  if (pt.includes("名駅")||pt.includes("名古屋")) return "名古屋站";
  if (pt.includes("榮")||pt.includes("栄"))       return "榮站";
  return pt;
}

function jstToday() {
  const d = new Date();
  const jst = new Date(d.getTime() + (9*60 + d.getTimezoneOffset())*60000);
  return String(jst.getMonth()+1).padStart(2,"0") + "/" + String(jst.getDate()).padStart(2,"0");
}

function clearResult() {
  document.getElementById("errMsg").className = "err";
  document.getElementById("resultArea").className = "result";
}

function showErr(msg) {
  const el = document.getElementById("errMsg");
  el.textContent = msg;
  el.className = "err show";
}

async function doSearch() {
  const phone = document.getElementById("inpPhone").value.trim();
  const name  = document.getElementById("inpName").value.trim();
  const isDriver = /^\d{1,4}$/.test(phone);

  if (!phone) { showErr("請輸入電話號碼"); return; }
  // 客人模式才需要姓名
  if (!isDriver && !name) { showErr("請輸入姓名"); return; }

  const btn = document.getElementById("searchBtn");
  btn.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
  btn.disabled = true;

  try {
    if (isDriver) {
      await searchDriver(phone);
    } else {
      await searchPassenger(phone, name);
    }
  } catch(e) {
    showErr("查詢失敗，請稍後再試");
  }

  btn.innerHTML = "查詢";
  btn.disabled = false;
}

// ── 司機模式 ──
async function searchDriver(num) {
  const r = await fetch(`${API}?action=findCar&num=${num}`);
  const d = await r.json();

  if (d.error) { showErr(d.error); return; }

  const today = jstToday();
  const res   = document.getElementById("resultArea");
  res.className = "result show";

  if (d.results.length === 1) {
    gotoDriver(d.results[0]); return;
  }

  // 多筆讓司機選（優先顯示今天）
  const sorted = d.results.sort((a,b) => {
    const aToday = a.date.includes(today) ? 0 : 1;
    const bToday = b.date.includes(today) ? 0 : 1;
    return aToday - bToday;
  });

  let html = `<div class="greeting">找到以下車次，請選擇今天的班次：</div>`;
  sorted.forEach(car => {
    const isToday = car.date.includes(today);
    html += `
    <div class="car-btn" onclick='gotoDriver(${JSON.stringify(car)})'>
      <div class="car-left">
        <div class="car-plate">${car.plate}</div>
        <div>
          <div class="car-vid">${car.vid}${isToday?' 📌':''}</div>
          <div class="car-info">${car.date} ｜ ${simplePt(car.depPt)} ${car.depTime}</div>
        </div>
      </div>
      <div class="car-arrow">›</div>
    </div>`;
  });
  res.innerHTML = html;
}

function gotoDriver(car) {
  const m = car.date.match(/(\d{2})\/(\d{2})/);
  const dateCode = m ? m[1]+m[2] : "0329";
  location.href = `driver.html?car=${encodeURIComponent(car.plate)}&date=${dateCode}`;
}

// ── 客人模式 ──
async function searchPassenger(phone, name) {
  const r = await fetch(`${API}?action=findPassenger&phone=${encodeURIComponent(phone)}&name=${encodeURIComponent(name)}`);
  const d = await r.json();

  if (d.error) { showErr("查無資料，請確認電話號碼與姓名是否正確"); return; }

  // 成功後隱藏輸入區
  document.getElementById("formArea").style.display = "none";

  const res = document.getElementById("resultArea");
  res.className = "result show";

  const PT_FULL = {
    "名古屋站": "名古屋站\nMinistop 名駅椿町店",
    "榮站":     "榮站\n10B出口（洋食厨房ムギ）",
  };
  const SUZUKA_FULL = "鈴鹿賽車場 Motopia\n〒510-0201 三重縣鈴鹿市井野町 7992";
  const RET_GATHER  = "回程集合地點：\napollostation 鈴鹿南 SS 對面";

  let html = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div class="greeting" style="margin:0">您好，${d.passengers[0].name}！</div>
    <button onclick="resetForm()" style="font-size:12px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer">重新查詢</button>
  </div>`;

  d.passengers.forEach(pax => {
    pax.bookings.forEach(b => {
      const pt = simplePt(b.depPt);
      const ptFull = PT_FULL[pt] || pt;
      const st = b.outStatus==="✅"?"✅ 去程已確認" : b.outStatus==="❌"?"❌ 去程未到" : "⏳ 待確認上車";
      html += `
      <div class="booking">
        <div class="booking-head">
          <div class="booking-date">${b.date}</div>
          <div class="booking-status">${st}</div>
        </div>
        <div class="booking-body">
          <div class="b-grid">
            <div class="b-item">車次<b>${b.vid}</b></div>
            <div class="b-item">車牌<b>${b.plate}</b></div>
            <div class="b-item">車種<b>${b.vtype}</b></div>
            <div class="b-item">乘坐人數<b>${b.pax} 人</b></div>
          </div>
          <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div class="b-item">
              去程上車地點
              <b style="font-size:14px;white-space:pre-line">${ptFull}</b>
              <div style="font-size:13px;font-weight:700;color:var(--text);margin-top:2px">${b.depTime} 出發</div>
            </div>
            <div class="b-item">
              回程上車地點
              <b style="font-size:14px;white-space:pre-line">${SUZUKA_FULL}</b>
              <div style="font-size:13px;font-weight:700;color:var(--text);margin-top:2px">${b.retTime} 出發</div>
            </div>
          </div>
          <div style="margin-top:10px;padding:10px 12px;background:#f8fafc;border-radius:8px;font-size:12px;color:var(--muted);white-space:pre-line">${RET_GATHER}</div>
        </div>
      </div>`;
    });
  });

  res.innerHTML = html;
}

function resetForm() {
  document.getElementById("formArea").style.display = "block";
  document.getElementById("resultArea").className = "result";
  document.getElementById("errMsg").className = "err";
  document.getElementById("inpName").value = "";
  document.getElementById("inpPhone").value = "";
}
</script>
</body>
</html>
